    <title>Senior Forward Deployed Engineer @ Taktile</title><meta name="title" content="Senior Forward Deployed Engineer @ Taktile" />
    
  <meta name="description" content="About The Role

Taktile is redefining how financial institutions use AI to make critical decisions, and we&#39;re growing fast. As a Senior Forward Deployed Engineer, you&#39;ll be at the heart of that transformation, owning the technical journey from customer onboarding to production-grade AI deployments that deliver real business impact.

If you&#39;re passionate about tech and AI, stay up to date on the latest AI developments, and have extensive experience with Python, SQL, REST APIs, you&#39;ll thrive here.

This role is initially remote, but candidates must be based in or near São Paulo, Brazil, as the position will involve regular in-person collaboration with customers and future local team presence.

What You&#39;ll Do as Senior Forward Deployed Engineer

 - Lead complex AI-driven Taktile deployments in production. You own technical delivery across multiple deployments, from scoping high-impact Agentic AI use cases to stable production.

 - Apply your technical expertise, problem-solving skills and creativity to help organizations address real-world challenges. Your day could include designing solution architectures, developing decision logic and deploying production-grade Generative AI agents, or aligning with key customer stakeholders - all while ensuring an outstanding experience and rapid time to value for Taktile’s customers.

 - You effectively scope work, sequence delivery, and proactively remove blockers, while making thoughtful trade-offs between scope, speed, and quality to ensure successful and timely project delivery.

 - Partner with Taktile’s product management team to turn your understanding of customer needs into actionable product insights, directly influencing the evolution of Taktile’s product roadmap.

 - Develop reusable resources, best practices, and tools to share your expertise and help scale the forward deployed engineering function across the organization.

About You

 - You bring 4-6 years of engineering or technical deployment experience that includes customer-facing work.

 - You are fluent in both English and Portuguese. Exceptional English communication skills are essential for this role, as you will regularly lead complex technical and business conversations with global customers and internal teams.

 - You have strong technical background, preferred in fields such as Computer Science, Mathematics, Software Engineering, Physics, and Data Science.

 - You write and review production-grade Python and SQL, and have strong command of REST API design and integrations.

 - You excel at breaking down complex problems and making quick, well-informed decisions even under pressure.

 - You build strong relationships with both technical and business stakeholders at all levels, driven by curiosity and a customer-centric mindset that helps you understand their needs and solve their challenges.

 - You&#39;re collaborative, curious, and low-ego- you work well across product, engineering, and GTM teams, and you bring a genuine desire to understand customers&#39; businesses.

 - You are based in the São Paulo area and comfortable traveling for in-person customer or team meetings.

Ideal Qualifications (but not required)

 - You have 4-6 years of experience as a Forward Deployed Engineer, Solution Engineer, Implementation Specialist or an equivalent position within a B2B SaaS company.

 - You have experience in building AI applications within financial services

 - You have experience in applying and optimizing statistical and machine learning models to solve business problems.

 - You have experience with at least one of the major cloud platforms (AWS, Azure, GCP).

 - You have experience of working at or with tier-1 banks in Brazil for risk decision solutions/vendors deployment projects.

What We Offer

 - Work with colleagues that lift you up, challenge you, celebrate you and help you grow. We come from many different backgrounds, but what we have in common is the desire to operate at the very top of our fields. If you are similarly capable, caring, and driven, you&#39;ll find yourself at home here.

 - Make an impact and meaningfully shape an early-stage company.

 - Experience a truly flat hierarchy and communicate directly with founding team members. Having an opinion and voicing your ideas is not only welcome but encouraged, especially when they challenge the status quo.

 - Learn from experienced mentors and achieve tremendous personal and professional growth. Get to know and leverage our network of leading tech investors and advisors around the globe.

 - Receive a top-of-market equity and cash compensation package.

 - Get access to a self-development budget you can use to e.g. attend conferences, buy books or take classes.

 - Use the equipment of your choice including meaningful home office set-up.

Our Stance

 - We&#39;re eager to meet talented and driven candidates regardless of whether they tick all the boxes. We&#39;re looking for someone who will add to our culture, not just fit within it. We strongly encourage individuals from groups traditionally underestimated and underrepresented in tech to apply.

 - We seek to actively recognize and combat racism, sexism, ableism and ageism. We embrace and support all gender identities and expressions, and celebrate love in its many forms. We won&#39;t inquire about how you identify or if you&#39;ve experienced discrimination, but if you want to tell your story, we are all ears.

About Us

Taktile helps financial institutions make smarter, safer decisions with the power of AI. Our software gives teams the tools to automate complex decisions — like who to onboard, how to underwrite, or when to flag suspicious activity — with full visibility and control.

By combining AI with a rich ecosystem of financial data, Taktile enables companies to adapt their decision-making in real time as markets, customer behavior, and risks evolve.

Our mission is to build the world’s leading platform for automated decision-making in financial services — setting the standard for how AI is applied responsibly and effectively in this industry.

We were founded by machine learning and data science experts with deep experience in financial services. Today, our team works across Berlin, London, and New York, bringing together engineers, entrepreneurs, and researchers from companies like Google, Amazon, and Meta, as well as fast-growing startups and enterprise leaders.

Backed by top investors including Y Combinator, Index Ventures, Balderton Capital, and Tiger Global, along with the founders of Looker, GitHub, Mulesoft, Datadog, and UiPath - we’re building a world-class organization across all functions and levels to power the next generation of AI-driven decision-making in financial services." />

Execution","ApprovalStepTitles","CoreMultipleBrandsFeedFiltering","ShowOfferVersionHistory","ApprovalNotesPerApprover","HrisPreferApplicationResume","AmplitudeSDK","ApprovalNotesFromEmail","CreditManagementV2","NewEmailSync","ReadCreditUsageFromBillingDb","AiCustomAgents","ADPRegionSettings","CustomAccessRolesSupportMode","EagerLoadInterviewEventsApplicationChain","PublicApiApplicationListBatchArchivedAt","BlockedApplicationSubmissionObjectType","WorkflowDependencyFixPointLoop","ProcessEngineUseExecutionIdCache","InAtsSourcingUserAccess","SlackAssistant","DsInfoRedesign","WorkflowConditionCache","CanonicalizeSchools","FetchManyPreserveRefetchParams"],"allowJobPostIndexing":true,"isDemoOrg":false,"theme":{"colors":{"version":"1","colorPrimary600":"#493FC1","colorPrimary900":"#1d1b3e"},"showJobFilters":true,"showLocationAddress":false,"showTeams":false,"showAutofillApplicationsBox":true,"logoWordmarkImageUrl":"https://app.ashbyhq.com/api/images/org-theme-wordmark/5c7f4544-c7c8-48e0-9b3a-f305dbbcda81/a83e8a3b-443c-45be-9160-e6656f5c7055/b72bf5af-deca-4612-8631-9e95eff76a9c.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/5c7f4544-c7c8-48e0-9b3a-f305dbbcda81/a83e8a3b-443c-45be-9160-e6656f5c7055/60a3841e-69ab-4655-8a36-028c471527f4.png","applicationSubmittedSuccessMessage":null,"jobBoardTopDescriptionHtml":null,"jobBoardBottomDescriptionHtml":null,"jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":null,"timezone":"Europe/Berlin","candidateScheduleCancellationReasonRequirementStatus":"Off","showCookieBanner":false},"posting":{"id":"3f5a9b8f-9c53-42a2-8d57-45f84bc58b1d","title":"Senior Forward Deployed Engineer","updatedAt":"2026-05-13T16:16:27.107Z","departmentName":"Value Delivery","departmentExternalName":"Value Delivery","teamName":"Value Delivery","teamExternalName":"Value Delivery","teamNames":["Value Delivery"],"locationName":"São Paulo","locationExternalName":"São Paulo","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<p style=\"min-height:1.5em\"><strong>About The Role</strong></p><p style=\"min-height:1.5em\">Taktile is redefining how financial institutions use AI to make critical decisions, and we're growing fast. As a Senior Forward Deployed Engineer, you'll be at the heart of that transformation, owning the technical journey from customer onboarding to production-grade AI deployments that deliver real business impact.</p><p style=\"min-height:1.5em\">If you're passionate about tech and AI, stay up to date on the latest AI developments, and have extensive experience with Python, SQL, REST APIs, you'll thrive here.</p><p style=\"min-height:1.5em\">This role is initially remote, but candidates must be based in or near<strong> São Paulo, Brazil,</strong> as the position will involve regular in-person collaboration with customers and future local team presence.</p><p style=\"min-height:1.5em\"><strong>What You'll Do as Senior Forward Deployed Engineer</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Lead complex AI-driven Taktile deployments in production. You own technical delivery across multiple deployments, from scoping high-impact Agentic AI use cases to stable production.</p></li><li><p style=\"min-height:1.5em\">Apply your technical expertise, problem-solving skills and creativity to help organizations address real-world challenges. Your day could include designing solution architectures, developing decision logic and deploying production-grade Generative AI agents, or aligning with key customer stakeholders - all while ensuring an outstanding experience and rapid time to value for Taktile’s customers.</p></li><li><p style=\"min-height:1.5em\">You effectively scope work, sequence delivery, and proactively remove blockers, while making thoughtful trade-offs between scope, speed, and quality to ensure successful and timely project delivery.</p></li><li><p style=\"min-height:1.5em\">Partner with Taktile’s product management team to turn your understanding of customer needs into actionable product insights, directly influencing the evolution of Taktile’s product roadmap.</p></li><li><p style=\"min-height:1.5em\">Develop reusable resources, best practices, and tools to share your expertise and help scale the forward deployed engineering function across the organization.</p></li></ul><p style=\"min-height:1.5em\"><strong>About You</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You bring 4-6 years of engineering or technical deployment experience that includes customer-facing work.</p></li><li><p style=\"min-height:1.5em\">You are fluent in both English and Portuguese. <strong>Exceptional English </strong>communication skills are essential for this role, as you will regularly lead complex technical and business conversations with global customers and internal teams. </p></li><li><p style=\"min-height:1.5em\">You have strong technical background, preferred in fields such as Computer Science, Mathematics, Software Engineering, Physics, and Data Science.</p></li><li><p style=\"min-height:1.5em\">You write and review production-grade Python and SQL, and have strong command of REST API design and integrations.</p></li><li><p style=\"min-height:1.5em\">You excel at breaking down complex problems and making quick, well-informed decisions even under pressure.</p></li><li><p style=\"min-height:1.5em\">You build strong relationships with both technical and business stakeholders at all levels, driven by curiosity and a customer-centric mindset that helps you understand their needs and solve their challenges.</p></li><li><p style=\"min-height:1.5em\">You're collaborative, curious, and low-ego- you work well across product, engineering, and GTM teams, and you bring a genuine desire to understand customers' businesses.</p></li><li><p style=\"min-height:1.5em\">You are based in the São Paulo area and comfortable traveling for in-person customer or team meetings.</p></li></ul><p style=\"min-height:1.5em\"><strong>Ideal Qualifications (but not required)</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have 4-6 years of experience as a Forward Deployed Engineer, Solution Engineer, Implementation Specialist or an equivalent position within a B2B SaaS company.</p></li><li><p style=\"min-height:1.5em\">You have experience in building AI applications within financial services</p></li><li><p style=\"min-height:1.5em\">You have experience in applying and optimizing statistical and machine learning models to solve business problems.</p></li><li><p style=\"min-height:1.5em\">You have experience with at least one of the major cloud platforms (AWS, Azure, GCP).</p></li><li><p style=\"min-height:1.5em\">You have experience of working at or with tier-1 banks in Brazil for risk decision solutions/vendors deployment projects.</p></li></ul><p style=\"min-height:1.5em\"><strong>What We Offer</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Work with colleagues that lift you up, challenge you, celebrate you and help you grow. We come from many different backgrounds, but what we have in common is the desire to operate at the very top of our fields. If you are similarly capable, caring, and driven, you'll find yourself at home here.</p></li><li><p style=\"min-height:1.5em\">Make an impact and meaningfully shape an early-stage company.</p></li><li><p style=\"min-height:1.5em\">Experience a truly flat hierarchy and communicate directly with founding team members. Having an opinion and voicing your ideas is not only welcome but encouraged, especially when they challenge the status quo.</p></li><li><p style=\"min-height:1.5em\">Learn from experienced mentors and achieve tremendous personal and professional growth. Get to know and leverage our network of leading tech investors and advisors around the globe.</p></li><li><p style=\"min-height:1.5em\">Receive a top-of-market equity and cash compensation package.</p></li><li><p style=\"min-height:1.5em\">Get access to a self-development budget you can use to e.g. attend conferences, buy books or take classes.</p></li><li><p style=\"min-height:1.5em\">Use the equipment of your choice including meaningful home office set-up.</p></li></ul><p style=\"min-height:1.5em\"><strong>Our Stance</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We're eager to meet talented and driven candidates regardless of whether they tick all the boxes. We're looking for someone who will add to our culture, not just fit within it. We strongly encourage individuals from groups traditionally underestimated and underrepresented in tech to apply.</p></li><li><p style=\"min-height:1.5em\">We seek to actively recognize and combat racism, sexism, ableism and ageism. We embrace and support all gender identities and expressions, and celebrate love in its many forms. We won't inquire about how you identify or if you've experienced discrimination, but if you want to tell your story, we are all ears.</p></li></ul><p style=\"min-height:1.5em\"><strong>About Us</strong></p><p style=\"min-height:1.5em\">Taktile helps financial institutions make smarter, safer decisions with the power of AI. Our software gives teams the tools to automate complex decisions — like who to onboard, how to underwrite, or when to flag suspicious activity — with full visibility and control.</p><p style=\"min-height:1.5em\">By combining AI with a rich ecosystem of financial data, Taktile enables companies to adapt their decision-making in real time as markets, customer behavior, and risks evolve.</p><p style=\"min-height:1.5em\">Our mission is to build the world’s leading platform for automated decision-making in financial services — setting the standard for how AI is applied responsibly and effectively in this industry.</p><p style=\"min-height:1.5em\">We were founded by machine learning and data science experts with deep experience in financial services. Today, our team works across Berlin, London, and New York, bringing together engineers, entrepreneurs, and researchers from companies like Google, Amazon, and Meta, as well as fast-growing startups and enterprise leaders.</p><p style=\"min-height:1.5em\">Backed by top investors including Y Combinator, Index Ventures, Balderton Capital, and Tiger Global, along with the founders of Looker, GitHub, Mulesoft, Datadog, and UiPath - we’re building a world-class organization across all functions and levels to power the next generation of AI-driven decision-making in financial services.</p>","descriptionPlainText":"About The Role\n\nTaktile is redefining how financial institutions use AI to make critical decisions, and we're growing fast. As a Senior Forward Deployed Engineer, you'll be at the heart of that transformation, owning the technical journey from customer onboarding to production-grade AI deployments that deliver real business impact.\n\nIf you're passionate about tech and AI, stay up to date on the latest AI developments, and have extensive experience with Python, SQL, REST APIs, you'll thrive here.\n\nThis role is initially remote, but candidates must be based in or near São Paulo, Brazil, as the position will involve regular in-person collaboration with customers and future local team presence.\n\nWhat You'll Do as Senior Forward Deployed Engineer\n\n - Lead complex AI-driven Taktile deployments in production. You own technical delivery across multiple deployments, from scoping high-impact Agentic AI use cases to stable production.\n\n - Apply your technical expertise, problem-solving skills and creativity to help organizations address real-world challenges. Your day could include designing solution architectures, developing decision logic and deploying production-grade Generative AI agents, or aligning with key customer stakeholders - all while ensuring an outstanding experience and rapid time to value for Taktile’s customers.\n\n - You effectively scope work, sequence delivery, and proactively remove blockers, while making thoughtful trade-offs between scope, speed, and quality to ensure successful and timely project delivery.\n\n - Partner with Taktile’s product management team to turn your understanding of customer needs into actionable product insights, directly influencing the evolution of Taktile’s product roadmap.\n\n - Develop reusable resources, best practices, and tools to share your expertise and help scale the forward deployed engineering function across the organization.\n\nAbout You\n\n - You bring 4-6 years of engineering or technical deployment experience that includes customer-facing work.\n\n - You are fluent in both English and Portuguese. Exceptional English communication skills are essential for this role, as you will regularly lead complex technical and business conversations with global customers and internal teams.\n\n - You have strong technical background, preferred in fields such as Computer Science, Mathematics, Software Engineering, Physics, and Data Science.\n\n - You write and review production-grade Python and SQL, and have strong command of REST API design and integrations.\n\n - You excel at breaking down complex problems and making quick, well-informed decisions even under pressure.\n\n - You build strong relationships with both technical and business stakeholders at all levels, driven by curiosity and a customer-centric mindset that helps you understand their needs and solve their challenges.\n\n - You're collaborative, curious, and low-ego- you work well across product, engineering, and GTM teams, and you bring a genuine desire to understand customers' businesses.\n\n - You are based in the São Paulo area and comfortable traveling for in-person customer or team meetings.\n\nIdeal Qualifications (but not required)\n\n - You have 4-6 years of experience as a Forward Deployed Engineer, Solution Engineer, Implementation Specialist or an equivalent position within a B2B SaaS company.\n\n - You have experience in building AI applications within financial services\n\n - You have experience in applying and optimizing statistical and machine learning models to solve business problems.\n\n - You have experience with at least one of the major cloud platforms (AWS, Azure, GCP).\n\n - You have experience of working at or with tier-1 banks in Brazil for risk decision solutions/vendors deployment projects.\n\nWhat We Offer\n\n - Work with colleagues that lift you up, challenge you, celebrate you and help you grow. We come from many different backgrounds, but what we have in common is the desire to operate at the very top of our fields. If you are similarly capable, caring, and driven, you'll find yourself at home here.\n\n - Make an impact and meaningfully shape an early-stage company.\n\n - Experience a truly flat hierarchy and communicate directly with founding team members. Having an opinion and voicing your ideas is not only welcome but encouraged, especially when they challenge the status quo.\n\n - Learn from experienced mentors and achieve tremendous personal and professional growth. Get to know and leverage our network of leading tech investors and advisors around the globe.\n\n - Receive a top-of-market equity and cash compensation package.\n\n - Get access to a self-development budget you can use to e.g. attend conferences, buy books or take classes.\n\n - Use the equipment of your choice including meaningful home office set-up.\n\nOur Stance\n\n - We're eager to meet talented and driven candidates regardless of whether they tick all the boxes. We're looking for someone who will add to our culture, not just fit within it. We strongly encourage individuals from groups traditionally underestimated and underrepresented in tech to apply.\n\n - We seek to actively recognize and combat racism, sexism, ableism and ageism. We embrace and support all gender identities and expressions, and celebrate love in its many forms. We won't inquire about how you identify or if you've experienced discrimination, but if you want to tell your story, we are all ears.\n\nAbout Us\n\nTaktile helps financial institutions make smarter, safer decisions with the power of AI. Our software gives teams the tools to automate complex decisions — like who to onboard, how to underwrite, or when to flag suspicious activity — with full visibility and control.\n\nBy combining AI with a rich ecosystem of financial data, Taktile enables companies to adapt their decision-making in real time as markets, customer behavior, and risks evolve.\n\nOur mission is to build the world’s leading platform for automated decision-making in financial services — setting the standard for how AI is applied responsibly and effectively in this industry.\n\nWe were founded by machine learning and data science experts with deep experience in financial services. Today, our team works across Berlin, London, and New York, bringing together engineers, entrepreneurs, and researchers from companies like Google, Amazon, and Meta, as well as fast-growing startups and enterprise leaders.\n\nBacked by top investors including Y Combinator, Index Ventures, Balderton Capital, and Tiger Global, along with the founders of Looker, GitHub, Mulesoft, Datadog, and UiPath - we’re building a world-class organization across all functions and levels to power the next generation of AI-driven decision-making in financial services.","descriptionParts":{"descriptionOpening":null,"descriptionBody":{"html":"<p style=\"min-height:1.5em\"><strong>About The Role</strong></p><p style=\"min-height:1.5em\">Taktile is redefining how financial institutions use AI to make critical decisions, and we're growing fast. As a Senior Forward Deployed Engineer, you'll be at the heart of that transformation, owning the technical journey from customer onboarding to production-grade AI deployments that deliver real business impact.</p><p style=\"min-height:1.5em\">If you're passionate about tech and AI, stay up to date on the latest AI developments, and have extensive experience with Python, SQL, REST APIs, you'll thrive here.</p><p style=\"min-height:1.5em\">This role is initially remote, but candidates must be based in or near<strong> São Paulo, Brazil,</strong> as the position will involve regular in-person collaboration with customers and future local team presence.</p><p style=\"min-height:1.5em\"><strong>What You'll Do as Senior Forward Deployed Engineer</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Lead complex AI-driven Taktile deployments in production. You own technical delivery across multiple deployments, from scoping high-impact Agentic AI use cases to stable production.</p></li><li><p style=\"min-height:1.5em\">Apply your technical expertise, problem-solving skills and creativity to help organizations address real-world challenges. Your day could include designing solution architectures, developing decision logic and deploying production-grade Generative AI agents, or aligning with key customer stakeholders - all while ensuring an outstanding experience and rapid time to value for Taktile’s customers.</p></li><li><p style=\"min-height:1.5em\">You effectively scope work, sequence delivery, and proactively remove blockers, while making thoughtful trade-offs between scope, speed, and quality to ensure successful and timely project delivery.</p></li><li><p style=\"min-height:1.5em\">Partner with Taktile’s product management team to turn your understanding of customer needs into actionable product insights, directly influencing the evolution of Taktile’s product roadmap.</p></li><li><p style=\"min-height:1.5em\">Develop reusable resources, best practices, and tools to share your expertise and help scale the forward deployed engineering function across the organization.</p></li></ul><p style=\"min-height:1.5em\"><strong>About You</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You bring 4-6 years of engineering or technical deployment experience that includes customer-facing work.</p></li><li><p style=\"min-height:1.5em\">You are fluent in both English and Portuguese. <strong>Exceptional English </strong>communication skills are essential for this role, as you will regularly lead complex technical and business conversations with global customers and internal teams. </p></li><li><p style=\"min-height:1.5em\">You have strong technical background, preferred in fields such as Computer Science, Mathematics, Software Engineering, Physics, and Data Science.</p></li><li><p style=\"min-height:1.5em\">You write and review production-grade Python and SQL, and have strong command of REST API design and integrations.</p></li><li><p style=\"min-height:1.5em\">You excel at breaking down complex problems and making quick, well-informed decisions even under pressure.</p></li><li><p style=\"min-height:1.5em\">You build strong relationships with both technical and business stakeholders at all levels, driven by curiosity and a customer-centric mindset that helps you understand their needs and solve their challenges.</p></li><li><p style=\"min-height:1.5em\">You're collaborative, curious, and low-ego- you work well across product, engineering, and GTM teams, and you bring a genuine desire to understand customers' businesses.</p></li><li><p style=\"min-height:1.5em\">You are based in the São Paulo area and comfortable traveling for in-person customer or team meetings.</p></li></ul><p style=\"min-height:1.5em\"><strong>Ideal Qualifications (but not required)</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have 4-6 years of experience as a Forward Deployed Engineer, Solution Engineer, Implementation Specialist or an equivalent position within a B2B SaaS company.</p></li><li><p style=\"min-height:1.5em\">You have experience in building AI applications within financial services</p></li><li><p style=\"min-height:1.5em\">You have experience in applying and optimizing statistical and machine learning models to solve business problems.</p></li><li><p style=\"min-height:1.5em\">You have experience with at least one of the major cloud platforms (AWS, Azure, GCP).</p></li><li><p style=\"min-height:1.5em\">You have experience of working at or with tier-1 banks in Brazil for risk decision solutions/vendors deployment projects.</p></li></ul><p style=\"min-height:1.5em\"><strong>What We Offer</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Work with colleagues that lift you up, challenge you, celebrate you and help you grow. We come from many different backgrounds, but what we have in common is the desire to operate at the very top of our fields. If you are similarly capable, caring, and driven, you'll find yourself at home here.</p></li><li><p style=\"min-height:1.5em\">Make an impact and meaningfully shape an early-stage company.</p></li><li><p style=\"min-height:1.5em\">Experience a truly flat hierarchy and communicate directly with founding team members. Having an opinion and voicing your ideas is not only welcome but encouraged, especially when they challenge the status quo.</p></li><li><p style=\"min-height:1.5em\">Learn from experienced mentors and achieve tremendous personal and professional growth. Get to know and leverage our network of leading tech investors and advisors around the globe.</p></li><li><p style=\"min-height:1.5em\">Receive a top-of-market equity and cash compensation package.</p></li><li><p style=\"min-height:1.5em\">Get access to a self-development budget you can use to e.g. attend conferences, buy books or take classes.</p></li><li><p style=\"min-height:1.5em\">Use the equipment of your choice including meaningful home office set-up.</p></li></ul><p style=\"min-height:1.5em\"><strong>Our Stance</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We're eager to meet talented and driven candidates regardless of whether they tick all the boxes. We're looking for someone who will add to our culture, not just fit within it. We strongly encourage individuals from groups traditionally underestimated and underrepresented in tech to apply.</p></li><li><p style=\"min-height:1.5em\">We seek to actively recognize and combat racism, sexism, ableism and ageism. We embrace and support all gender identities and expressions, and celebrate love in its many forms. We won't inquire about how you identify or if you've experienced discrimination, but if you want to tell your story, we are all ears.</p></li></ul><p style=\"min-height:1.5em\"><strong>About Us</strong></p><p style=\"min-height:1.5em\">Taktile helps financial institutions make smarter, safer decisions with the power of AI. Our software gives teams the tools to automate complex decisions — like who to onboard, how to underwrite, or when to flag suspicious activity — with full visibility and control.</p><p style=\"min-height:1.5em\">By combining AI with a rich ecosystem of financial data, Taktile enables companies to adapt their decision-making in real time as markets, customer behavior, and risks evolve.</p><p style=\"min-height:1.5em\">Our mission is to build the world’s leading platform for automated decision-making in financial services — setting the standard for how AI is applied responsibly and effectively in this industry.</p><p style=\"min-height:1.5em\">We were founded by machine learning and data science experts with deep experience in financial services. Today, our team works across Berlin, London, and New York, bringing together engineers, entrepreneurs, and researchers from companies like Google, Amazon, and Meta, as well as fast-growing startups and enterprise leaders.</p><p style=\"min-height:1.5em\">Backed by top investors including Y Combinator, Index Ventures, Balderton Capital, and Tiger Global, along with the founders of Looker, GitHub, Mulesoft, Datadog, and UiPath - we’re building a world-class organization across all functions and levels to power the next generation of AI-driven decision-making in financial services.</p>","plain":"About The Role\n\nTaktile is redefining how financial institutions use AI to make critical decisions, and we're growing fast. As a Senior Forward Deployed Engineer, you'll be at the heart of that transformation, owning the technical journey from customer onboarding to production-grade AI deployments that deliver real business impact.\n\nIf you're passionate about tech and AI, stay up to date on the latest AI developments, and have extensive experience with Python, SQL, REST APIs, you'll thrive here.\n\nThis role is initially remote, but candidates must be based in or near São Paulo, Brazil, as the position will involve regular in-person collaboration with customers and future local team presence.\n\nWhat You'll Do as Senior Forward Deployed Engineer\n\n - Lead complex AI-driven Taktile deployments in production. You own technical delivery across multiple deployments, from scoping high-impact Agentic AI use cases to stable production.\n\n - Apply your technical expertise, problem-solving skills and creativity to help organizations address real-world challenges. Your day could include designing solution architectures, developing decision logic and deploying production-grade Generative AI agents, or aligning with key customer stakeholders - all while ensuring an outstanding experience and rapid time to value for Taktile’s customers.\n\n - You effectively scope work, sequence delivery, and proactively remove blockers, while making thoughtful trade-offs between scope, speed, and quality to ensure successful and timely project delivery.\n\n - Partner with Taktile’s product management team to turn your understanding of customer needs into actionable product insights, directly influencing the evolution of Taktile’s product roadmap.\n\n - Develop reusable resources, best practices, and tools to share your expertise and help scale the forward deployed engineering function across the organization.\n\nAbout You\n\n - You bring 4-6 years of engineering or technical deployment experience that includes customer-facing work.\n\n - You are fluent in both English and Portuguese. Exceptional English communication skills are essential for this role, as you will regularly lead complex technical and business conversations with global customers and internal teams.\n\n - You have strong technical background, preferred in fields such as Computer Science, Mathematics, Software Engineering, Physics, and Data Science.\n\n - You write and review production-grade Python and SQL, and have strong command of REST API design and integrations.\n\n - You excel at breaking down complex problems and making quick, well-informed decisions even under pressure.\n\n - You build strong relationships with both technical and business stakeholders at all levels, driven by curiosity and a customer-centric mindset that helps you understand their needs and solve their challenges.\n\n - You're collaborative, curious, and low-ego- you work well across product, engineering, and GTM teams, and you bring a genuine desire to understand customers' businesses.\n\n - You are based in the São Paulo area and comfortable traveling for in-person customer or team meetings.\n\nIdeal Qualifications (but not required)\n\n - You have 4-6 years of experience as a Forward Deployed Engineer, Solution Engineer, Implementation Specialist or an equivalent position within a B2B SaaS company.\n\n - You have experience in building AI applications within financial services\n\n - You have experience in applying and optimizing statistical and machine learning models to solve business problems.\n\n - You have experience with at least one of the major cloud platforms (AWS, Azure, GCP).\n\n - You have experience of working at or with tier-1 banks in Brazil for risk decision solutions/vendors deployment projects.\n\nWhat We Offer\n\n - Work with colleagues that lift you up, challenge you, celebrate you and help you grow. We come from many different backgrounds, but what we have in common is the desire to operate at the very top of our fields. If you are similarly capable, caring, and driven, you'll find yourself at home here.\n\n - Make an impact and meaningfully shape an early-stage company.\n\n - Experience a truly flat hierarchy and communicate directly with founding team members. Having an opinion and voicing your ideas is not only welcome but encouraged, especially when they challenge the status quo.\n\n - Learn from experienced mentors and achieve tremendous personal and professional growth. Get to know and leverage our network of leading tech investors and advisors around the globe.\n\n - Receive a top-of-market equity and cash compensation package.\n\n - Get access to a self-development budget you can use to e.g. attend conferences, buy books or take classes.\n\n - Use the equipment of your choice including meaningful home office set-up.\n\nOur Stance\n\n - We're eager to meet talented and driven candidates regardless of whether they tick all the boxes. We're looking for someone who will add to our culture, not just fit within it. We strongly encourage individuals from groups traditionally underestimated and underrepresented in tech to apply.\n\n - We seek to actively recognize and combat racism, sexism, ableism and ageism. We embrace and support all gender identities and expressions, and celebrate love in its many forms. We won't inquire about how you identify or if you've experienced discrimination, but if you want to tell your story, we are all ears.\n\nAbout Us\n\nTaktile helps financial institutions make smarter, safer decisions with the power of AI. Our software gives teams the tools to automate complex decisions — like who to onboard, how to underwrite, or when to flag suspicious activity — with full visibility and control.\n\nBy combining AI with a rich ecosystem of financial data, Taktile enables companies to adapt their decision-making in real time as markets, customer behavior, and risks evolve.\n\nOur mission is to build the world’s leading platform for automated decision-making in financial services — setting the standard for how AI is applied responsibly and effectively in this industry.\n\nWe were founded by machine learning and data science experts with deep experience in financial services. Today, our team works across Berlin, London, and New York, bringing together engineers, entrepreneurs, and researchers from companies like Google, Amazon, and Meta, as well as fast-growing startups and enterprise leaders.\n\nBacked by top investors including Y Combinator, Index Ventures, Balderton Capital, and Tiger Global, along with the founders of Looker, GitHub, Mulesoft, Datadog, and UiPath - we’re building a world-class organization across all functions and levels to power the next generation of AI-driven decision-making in financial services."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":null,"surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Forward Deployed Engineer","description":"<p style=\"min-height:1.5em\"><strong>About The Role</strong></p><p style=\"min-height:1.5em\">Taktile is redefining how financial institutions use AI to make critical decisions, and we're growing fast. As a Senior Forward Deployed Engineer, you'll be at the heart of that transformation, owning the technical journey from customer onboarding to production-grade AI deployments that deliver real business impact.</p><p style=\"min-height:1.5em\">If you're passionate about tech and AI, stay up to date on the latest AI developments, and have extensive experience with Python, SQL, REST APIs, you'll thrive here.</p><p style=\"min-height:1.5em\">This role is initially remote, but candidates must be based in or near<strong> São Paulo, Brazil,</strong> as the position will involve regular in-person collaboration with
