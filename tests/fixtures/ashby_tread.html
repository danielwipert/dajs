    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"AI Native Forward Deployed Engineer","description":"<p style=\"min-height:1.5em\"><strong>About Tread</strong></p><p style=\"min-height:1.5em\">Tread is an AI-native vertical SaaS platform transforming construction materials logistics—a massive, essential industry that moves the aggregate, asphalt, and concrete behind every road, bridge, and building. In March 2026, we crossed $1Bn in monthly delivered load value on the platform, and we’re at ~$XM ARR and growing fast.</p><p style=\"min-height:1.5em\">Our AI-powered platform serves Haulers, Producers, and Contractors—optimizing truck routing, loaded-mile delivery, and project planning while delivering exceptional customer service through personalized AI agents.</p><p style=\"min-height:1.5em\">We’re a Series A company backed by Mucker Capital, and we’re building the team that will take us from $XM to $XXM+ ARR.<br /><br /><strong>Why This Role Exists</strong></p><p style=\"min-height:1.5em\">Tread's customers are construction companies, materials producers, and hauling fleets. Their operations are complex, messy, and high-stakes. Dispatchers are moving hundreds of trucks a day. Scale operators are weighing thousands of loads. Back-office teams are reconciling millions of dollars in freight.</p><p style=\"min-height:1.5em\">We can't build the right product from a desk. This role exists to close the gap between our customers and our codebase. You'll be in the field learning how these operations actually work, then back at your machine shipping solutions the same day. The feedback loop is measured in hours, not sprints.</p><p style=\"min-height:1.5em\">Today, technical implementation and field-driven product development is run by the founding team and a small engineering group. To scale from $XM to $XXM+ ARR, we need Forward Deployed Engineers who can live at the intersection of customer operations and our codebase—turning what they see in the field into shipped software before the next site visit.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What You Own</strong></p><p style=\"min-height:1.5em\">You are the technical bridge between our customers and our product. You'll own the end-to-end technical relationship for your accounts, from first integration through long-term expansion, across four core areas:</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Customer Implementation &amp; Technical Delivery</strong> Lead technical implementation for new customers: API integrations, data mapping, workflow configuration, and scale house connectivity. Build custom integrations, data pipelines, and automation for customers with complex requirements. Debug and resolve technical issues in the field, often on the same day they surface. Own the technical relationship with assigned accounts—you are their go-to when something is broken or needs to be built.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Product Development from the Field</strong> Turn customer pain points into shipped features. You have the context and the ability to build. Contribute directly to Tread's codebase (Rails API, GraphQL, React) based on what you learn in the field. Prototype and validate solutions with customers before they become full product investments. Feed structured, prioritized insights to Product and Engineering. Our model: 45 minutes with the customer, 45 minutes building.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Scaled Enablement &amp; Documentation</strong> Build technical onboarding materials, API documentation, and integration guides for customers. Develop self-serve tools and content that reduce the need for hands-on support as we scale. Plan and facilitate QBRs with strategic accounts. Bring data. Bring insights. Bring the roadmap.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Expansion &amp; Retention Through Technical Depth</strong> Identify what makes Tread sticky and execute relentlessly to deliver that value. Expand revenue with existing customers by uncovering problems and solving them before they're asked. Help turn our data moat into self-reinforcing product loops that get smarter the longer a customer is on the platform. Own the technical health of your portfolio.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What Success Looks Like</strong></p><p style=\"min-height:1.5em\"><strong>First 90 Days</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Visited at least 3 customer sites. You can describe their dispatch workflow, scale house operations, and back-office processes from memory.</p></li><li><p style=\"min-height:1.5em\">Shipped at least 2 customer-facing improvements based on direct field observations.</p></li><li><p style=\"min-height:1.5em\">Taken ownership of the technical implementation for at least 1 new customer.</p></li><li><p style=\"min-height:1.5em\">Built relationships with key users at your assigned accounts. They know your name and they call you directly.</p></li><li><p style=\"min-height:1.5em\">Established a baseline view of open technical debt and integration gaps across your portfolio.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>First 6 Months</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Embedded with customers. Learning the codebase while in the field. Shipping fast alongside a team of under 20 people where your impact is immediate and visible.</p></li><li><p style=\"min-height:1.5em\">Established a repeatable pattern: customer meeting to shipped outcome in under a week.</p></li><li><p style=\"min-height:1.5em\">Contributed meaningfully to at least 1 product initiative that originated from your field work.</p></li><li><p style=\"min-height:1.5em\">Technical training content and integration guides shipped and in use by customers.</p></li><li><p style=\"min-height:1.5em\">At least 1 expansion opportunity identified and influenced by your work.</p></li><li><p style=\"min-height:1.5em\">Time-to-first-value for new implementations trending down measurably.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>First Year</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Customers in your portfolio have measurably higher adoption and satisfaction than baseline.</p></li><li><p style=\"min-height:1.5em\">You've become the connective tissue between what customers need and what we build.</p></li><li><p style=\"min-height:1.5em\">Multiple product features in production trace back to your field insights.</p></li><li><p style=\"min-height:1.5em\">You've helped define the FDE playbook that the next hire will use.</p></li><li><p style=\"min-height:1.5em\">You are the person customers call when something is broken, and the person Engineering trusts to represent the field in any roadmap conversation.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What We’re Looking For</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">2+ years of software engineering experience. You can write production code in at least one of: Ruby/Rails, JavaScript/React, Python, or equivalent.</p></li><li><p style=\"min-height:1.5em\">Comfort with APIs, databases, and data pipelines. You can read a GraphQL schema, debug an integration, and write a migration.</p></li><li><p style=\"min-height:1.5em\">Customer-facing instincts. You can sit in a room with a VP of Operations at a trucking company and earn their trust.</p></li><li><p style=\"min-height:1.5em\">Bias toward action. You see a problem, you fix it. You don't wait for a ticket.</p></li><li><p style=\"min-height:1.5em\">Strong written and verbal communication. You can translate a messy customer conversation into a clear problem statement and a proposed solution.\\</p></li><li><p style=\"min-height:1.5em\">Willingness to travel. You'll be on-site with customers regularly, especially early on.</p></li><li><p style=\"min-height:1.5em\">High ownership, low ego. You'll do support tickets, write docs, build features, and present at QBRs. Whatever the customer needs.</p></li><li><p style=\"min-height:1.5em\">Analytical mindset. You instrument what you ship, track adoption, and use data to decide what to build next.</p></li><li><p style=\"min-height:1.5em\">Builder mentality. You'll personally debug a scale house integration in the morning and prototype a new dispatcher workflow in the afternoon.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Bonus Points</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience in construction technology, heavy civil, logistics, supply chain, or field services.</p></li><li><p style=\"min-height:1.5em\">Familiarity with our stack: Rails, GraphQL, React, Intercom, Linear, PostHog, Omni.</p></li><li><p style=\"min-height:1.5em\">Experience with AI/ML product development or leveraging LLMs in customer-facing workflows (AI-assisted integrations, automated onboarding, intelligent ticket deflection).</p></li><li><p style=\"min-height:1.5em\">You've worked at a Series A–C company with under 50 people and thrived in the ambiguity.</p></li><li><p style=\"min-height:1.5em\">Experience with e-ticketing, scale house systems, ERP integrations, or DOT compliance.</p></li><li><p style=\"min-height:1.5em\">You've shipped a feature that originated from a single customer conversation and watched it scale across an entire book of business.</p></li></ul>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Tread","value":"cac3ce33-3ee7-4736-9209-43a0220821f1"},"datePosted":"2026-04-18","hiringOrganization":{"@type":"Organization","name":"Tread","sameAs":"https://tread.ai","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/3a2f90fb-c309-4940-8e03-e077030e7a02/de21d6e6-011c-4a1a-9f14-9895bd4520db/7507dd0b-f378-4c06-a4eb-64b2d67bd8e7.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Remote","addressCountry":"United States"}},"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":120000,"maxValue":160000,"unitText":"YEAR"}},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"}}</script>

.5em\"><strong>About Tread</strong></p><p style=\"min-height:1.5em\">Tread is an AI-native vertical SaaS platform transforming construction materials logistics—a massive, essential industry that moves the aggregate, asphalt, and concrete behind every road, bridge, and building. In March 2026, we crossed $1Bn in monthly delivered load value on the platform, and we’re at ~$XM ARR and growing fast.</p><p style=\"min-height:1.5em\">Our AI-powered platform serves Haulers, Producers, and Contractors—optimizing truck routing, loaded-mile delivery, and project planning while delivering exceptional customer service through personalized AI agents.</p><p style=\"min-height:1.5em\">We’re a Series A company backed by Mucker Capital, and we’re building the team that will take us from $XM to $XXM+ ARR.<br /><br /><strong>Why This Role Exists</strong></p><p style=\"min-height:1.5em\">Tread's customers are construction companies, materials producers, and hauling fleets. Their operations are complex, messy, and high-stakes. Dispatchers are moving hundreds of trucks a day. Scale operators are weighing thousands of loads. Back-office teams are reconciling millions of dollars in freight.</p><p style=\"min-height:1.5em\">We can't build the right product from a desk. This role exists to close the gap between our customers and our codebase. You'll be in the field learning how these operations actually work, then back at your machine shipping solutions the same day. The feedback loop is measured in hours, not sprints.</p><p style=\"min-height:1.5em\">Today, technical implementation and field-driven product development is run by the founding team and a small engineering group. To scale from $XM to $XXM+ ARR, we need Forward Deployed Engineers who can live at the intersection of customer operations and our codebase—turning what they see in the field into shipped software before the next site visit.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What You Own</strong></p><p style=\"min-height:1.5em\">You are the technical bridge between our customers and our product. You'll own the end-to-end technical relationship for your accounts, from first integration through long-term expansion, across four core areas:</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Customer Implementation &amp; Technical Delivery</strong> Lead technical implementation for new customers: API integrations, data mapping, workflow configuration, and scale house connectivity. Build custom integrations, data pipelines, and automation for customers with complex requirements. Debug and resolve technical issues in the field, often on the same day they surface. Own the technical relationship with assigned accounts—you are their go-to when something is broken or needs to be built.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Product Development from the Field</strong> Turn customer pain points into shipped features. You have the context and the ability to build. Contribute directly to Tread's codebase (Rails API, GraphQL, React) based on what you learn in the field. Prototype and validate solutions with customers before they become full product investments. Feed structured, prioritized insights to Product and Engineering. Our model: 45 minutes with the customer, 45 minutes building.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Scaled Enablement &amp; Documentation</strong> Build technical onboarding materials, API documentation, and integration guides for customers. Develop self-serve tools and content that reduce the need for hands-on support as we scale. Plan and facilitate QBRs with strategic accounts. Bring data. Bring insights. Bring the roadmap.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Expansion &amp; Retention Through Technical Depth</strong> Identify what makes Tread sticky and execute relentlessly to deliver that value. Expand revenue with existing customers by uncovering problems and solving them before they're asked. Help turn our data moat into self-reinforcing product loops that get smarter the longer a customer is on the platform. Own the technical health of your portfolio.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What Success Looks Like</strong></p><p style=\"min-height:1.5em\"><strong>First 90 Days</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Visited at least 3 customer sites. You can describe their dispatch workflow, scale house operations, and back-office processes from memory.</p></li><li><p style=\"min-height:1.5em\">Shipped at least 2 customer-facing improvements based on direct field observations.</p></li><li><p style=\"min-height:1.5em\">Taken ownership of the technical implementation for at least 1 new customer.</p></li><li><p style=\"min-height:1.5em\">Built relationships with key users at your assigned accounts. They know your name and they call you directly.</p></li><li><p style=\"min-height:1.5em\">Established a baseline view of open technical debt and integration gaps across your portfolio.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>First 6 Months</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Embedded with customers. Learning the codebase while in the field. Shipping fast alongside a team of under 20 people where your impact is immediate and visible.</p></li><li><p style=\"min-height:1.5em\">Established a repeatable pattern: customer meeting to shipped outcome in under a week.</p></li><li><p style=\"min-height:1.5em\">Contributed meaningfully to at least 1 product initiative that originated from your field work.</p></li><li><p style=\"min-height:1.5em\">Technical training content and integration guides shipped and in use by customers.</p></li><li><p style=\"min-height:1.5em\">At least 1 expansion opportunity identified and influenced by your work.</p></li><li><p style=\"min-height:1.5em\">Time-to-first-value for new implementations trending down measurably.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>First Year</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Customers in your portfolio have measurably higher adoption and satisfaction than baseline.</p></li><li><p style=\"min-height:1.5em\">You've become the connective tissue between what customers need and what we build.</p></li><li><p style=\"min-height:1.5em\">Multiple product features in production trace back to your field insights.</p></li><li><p style=\"min-height:1.5em\">You've helped define the FDE playbook that the next hire will use.</p></li><li><p style=\"min-height:1.5em\">You are the person customers call when something is broken, and the person Engineering trusts to represent the field in any roadmap conversation.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What We’re Looking For</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">2+ years of software engineering experience. You can write production code in at least one of: Ruby/Rails, JavaScript/React, Python, or equivalent.</p></li><li><p style=\"min-height:1.5em\">Comfort with APIs, databases, and data pipelines. You can read a GraphQL schema, debug an integration, and write a migration.</p></li><li><p style=\"min-height:1.5em\">Customer-facing instincts. You can sit in a room with a VP of Operations at a trucking company and earn their trust.</p></li><li><p style=\"min-height:1.5em\">Bias toward action. You see a problem, you fix it. You don't wait for a ticket.</p></li><li><p style=\"min-height:1.5em\">Strong written and verbal communication. You can translate a messy customer conversation into a clear problem statement and a proposed solution.\\</p></li><li><p style=\"min-height:1.5em\">Willingness to travel. You'll be on-site with customers regularly, especially early on.</p></li><li><p style=\"min-height:1.5em\">High ownership, low ego. You'll do support tickets, write docs, build features, and present at QBRs. Whatever the customer needs.</p></li><li><p style=\"min-height:1.5em\">Analytical mindset. You instrument what you ship, track adoption, and use data to decide what to build next.</p></li><li><p style=\"min-height:1.5em\">Builder mentality. You'll personally debug a scale house integration in the morning and prototype a new dispatcher workflow in the afternoon.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Bonus Points</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience in construction technology, heavy civil, logistics, supply chain, or field services.</p></li><li><p style=\"min-height:1.5em\">Familiarity with our stack: Rails, GraphQL, React, Intercom, Linear, PostHog, Omni.</p></li><li><p style=\"min-height:1.5em\">Experience with AI/ML product development or leveraging LLMs in customer-facing workflows (AI-assisted integrations, automated onboarding, intelligent ticket deflection).</p></li><li><p style=\"min-height:1.5em\">You've worked at a Series A–C company with under 50 people and thrived in the ambiguity.</p></li><li><p style=\"min-height:1.5em\">Experience with e-ticketing, scale house systems, ERP integrations, or DOT compliance.</p></li><li><p style=\"min-height:1.5em\">You've shipped a feature that originated from a single customer conversation and watched it scale across an entire book of business.</p></li></ul>","descriptionPlainText":"About Tread\n\nTread is an AI-native vertical SaaS platform transforming construction materials logistics—a massive, essential industry that moves the aggregate, asphalt, and concrete behind every road, bridge, and building. In March 2026, we crossed $1Bn in monthly delivered load value on the platform, and we’re at ~$XM ARR and growing fast.\n\nOur AI-powered platform serves Haulers, Producers, and Contractors—optimizing truck routing, loaded-mile delivery, and project planning while delivering exceptional customer service through personalized AI agents.\n\nWe’re a Series A company backed by Mucker Capital, and we’re building the team that will take us from $XM to $XXM+ ARR.\n\nWhy This Role Exists\n\nTread's customers are construction companies, materials producers, and hauling fleets. Their operations are complex, messy, and high-stakes. Dispatchers are moving hundreds of trucks a day. Scale operators are weighing thousands of loads. Back-office teams are reconciling millions of dollars in freight.\n\nWe can't build the right product from a desk. This role exists to close the gap between our customers and our codebase. You'll be in the field learning how these operations actually work, then back at your machine shipping solutions the same day. The feedback loop is measured in hours, not sprints.\n\nToday, technical implementation and field-driven product development is run by the founding team and a small engineering group. To scale from $XM to $XXM+ ARR, we need Forward Deployed Engineers who can live at the intersection of customer operations and our codebase—turning what they see in the field into shipped software before the next site visit.\n\nWhat You Own\n\nYou are the technical bridge between our customers and our product. You'll own the end-to-end technical relationship for your accounts, from first integration through long-term expansion, across four core areas:\n\nCustomer Implementation & Technical Delivery Lead technical implementation for new customers: API integrations, data mapping, workflow configuration, and scale house connectivity. Build custom integrations, data pipelines, and automation for customers with complex requirements. Debug and resolve technical issues in the field, often on the same day they surface. Own the technical relationship with assigned accounts—you are their go-to when something is broken or needs to be built.\n\nProduct Development from the Field Turn customer pain points into shipped features. You have the context and the ability to build. Contribute directly to Tread's codebase (Rails API, GraphQL, React) based on what you learn in the field. Prototype and validate solutions with customers before they become full product investments. Feed structured, prioritized insights to Product and Engineering. Our model: 45 minutes with the customer, 45 minutes building.\n\nScaled Enablement & Documentation Build technical onboarding materials, API documentation, and integration guides for customers. Develop self-serve tools and content that reduce the need for hands-on support as we scale. Plan and facilitate QBRs with strategic accounts. Bring data. Bring insights. Bring the roadmap.\n\nExpansion & Retention Through Technical Depth Identify what makes Tread sticky and execute relentlessly to deliver that value. Expand revenue with existing customers by uncovering problems and solving them before they're asked. Help turn our data moat into self-reinforcing product loops that get smarter the longer a customer is on the platform. Own the technical health of your portfolio.\n\nWhat Success Looks Like\n\nFirst 90 Days\n\n - Visited at least 3 customer sites. You can describe their dispatch workflow, scale house operations, and back-office processes from memory.\n\n - Shipped at least 2 customer-facing improvements based on direct field observations.\n\n - Taken ownership of the technical implementation for at least 1 new customer.\n\n - Built relationships with key users at your assigned accounts. They know your name and they call you directly.\n\n - Established a baseline view of open technical debt and integration gaps across your portfolio.\n\nFirst 6 Months\n\n - Embedded with customers. Learning the codebase while in the field. Shipping fast alongside a team of under 20 people where your impact is immediate and visible.\n\n - Established a repeatable pattern: customer meeting to shipped outcome in under a week.\n\n - Contributed meaningfully to at least 1 product initiative that originated from your field work.\n\n - Technical training content and integration guides shipped and in use by customers.\n\n - At least 1 expansion opportunity identified and influenced by your work.\n\n - Time-to-first-value for new implementations trending down measurably.\n\nFirst Year\n\n - Customers in your portfolio have measurably higher adoption and satisfaction than baseline.\n\n - You've become the connective tissue between what customers need and what we build.\n\n - Multiple product features in production trace back to your field insights.\n\n - You've helped define the FDE playbook that the next hire will use.\n\n - You are the person customers call when something is broken, and the person Engineering trusts to represent the field in any roadmap conversation.\n\nWhat We’re Looking For\n\n - 2+ years of software engineering experience. You can write production code in at least one of: Ruby/Rails, JavaScript/React, Python, or equivalent.\n\n - Comfort with APIs, databases, and data pipelines. You can read a GraphQL schema, debug an integration, and write a migration.\n\n - Customer-facing instincts. You can sit in a room with a VP of Operations at a trucking company and earn their trust.\n\n - Bias toward action. You see a problem, you fix it. You don't wait for a ticket.\n\n - Strong written and verbal communication. You can translate a messy customer conversation into a clear problem statement and a proposed solution.\\\n\n - Willingness to travel. You'll be on-site with customers regularly, especially early on.\n\n - High ownership, low ego. You'll do support tickets, write docs, build features, and present at QBRs. Whatever the customer needs.\n\n - Analytical mindset. You instrument what you ship, track adoption, and use data to decide what to build next.\n\n - Builder mentality. You'll personally debug a scale house integration in the morning and prototype a new dispatcher workflow in the afternoon.\n\nBonus Points\n\n - Experience in construction technology, heavy civil, logistics, supply chain, or field services.\n\n - Familiarity with our stack: Rails, GraphQL, React, Intercom, Linear, PostHog, Omni.\n\n - Experience with AI/ML product development or leveraging LLMs in customer-facing workflows (AI-assisted integrations, automated onboarding, intelligent ticket deflection).\n\n - You've worked at a Series A–C company with under 50 people and thrived in the ambiguity.\n\n - Experience with e-ticketing, scale house systems, ERP integrations, or DOT compliance.\n\n - You've shipped a feature that originated from a single customer conversation and watched it scale across an entire book of business.","descriptionParts":{"descriptionOpening":null,"descriptionBody":{"html":"<p style=\"min-height:1.5em\"><strong>About Tread</strong></p><p style=\"min-height:1.5em\">Tread is an AI-native vertical SaaS platform transforming construction materials logistics—a massive, essential industry that moves the aggregate, asphalt, and concrete behind every road, bridge, and building. In March 2026, we crossed $1Bn in monthly delivered load value on the platform, and we’re at ~$XM ARR and growing fast.</p><p style=\"min-height:1.5em\">Our AI-powered platform serves Haulers, Producers, and Contractors—optimizing truck routing, loaded-mile delivery, and project planning while delivering exceptional customer service through personalized AI agents.</p><p style=\"min-height:1.5em\">We’re a Series A company backed by Mucker Capital, and we’re building the team that will take us from $XM to $XXM+ ARR.<br /><br /><strong>Why This Role Exists</strong></p><p style=\"min-height:1.5em\">Tread's customers are construction companies, materials producers, and hauling fleets. Their operations are complex, messy, and high-stakes. Dispatchers are moving hundreds of trucks a day. Scale operators are weighing thousands of loads. Back-off eflection).</p></li><li><p style=\"min-height:1.5em\">You've worked at a Series A–C company with under 50 people and thrived in the ambiguity.</p></li><li><p style=\"min-height:1.5em\">Experience with e-ticketing, scale house systems, ERP integrations, or DOT compliance.</p></li><li><p style=\"min-height:1.5em\">You've shipped a feature that originated from a single customer conversation and watched it scale across an entire book of business.</p></li></ul>","plain":"About Tread\n\nTread is an AI-native vertical SaaS platform transforming construction materials logistics—a massive, essential industry that moves the aggregate, asphalt, and concrete behind every road, bridge, and building. In March 2026, we crossed $1Bn in monthly delivered load value on the platform, and we’re at ~$XM ARR and growing fast.\n\nOur AI-powered platform serves Haulers, Producers, and Contractors—optimizing truck routing, loaded-mile delivery, and project planning while delivering exceptional customer service through personalized AI agents.\n\nWe’re a Series A company backed by Mucker Capital, and we’re building the team that will take us from $XM to $XXM+ ARR.\n\nWhy This Role Exists\n\nTread's customers are construction companies, materials producers, and hauling fleets. Their operations are complex, messy, and high-stakes. Dispatchers are moving hundreds of trucks a day. Scale operators are weighing thousands of loads. Back-office teams are reconciling millions of dollars in freight.\n\nWe can't build the right product from a desk. This role exists to close the gap between our customers and our codebase. You'll be in the field learning how these operations actually work, then back at your machine shipping solutions the same day. The feedback loop is measured in hours, not sprints.\n\nToday, technical implementation and field-driven product development is run by the founding team and a small engineering group. To scale from $XM to $XXM+ ARR, we need Forward Deployed Engineers who can live at the intersection of customer operations and our codebase—turning what they see in the field into shipped software before the next site visit.\n\nWhat You Own\n\nYou are the technical bridge between our customers and our product. You'll own the end-to-end technical relationship for your accounts, from first integration through long-term expansion, across four core areas:\n\nCustomer Implementation & Technical Delivery Lead technical implementation for new customers: API integrations, data mapping, workflow configuration, and scale house connectivity. Build custom integrations, data pipelines, and automation for customers with complex requirements. Debug and resolve technical issues in the field, often on the same day they surface. Own the technical relationship with assigned accounts—you are their go-to when something is broken or needs to be built.\n\nProduct Development from the Field Turn customer pain points into shipped features. You have the context and the ability to build. Contribute directly to Tread's codebase (Rails API, GraphQL, React) based on what you learn in the field. Prototype and validate solutions with customers before they become full product investments. Feed structured, prioritized insights to Product and Engineering. Our model: 45 minutes with the customer, 45 minutes building.\n\nScaled Enablement & Documentation Build technical onboarding materials, API documentation, and integration guides for customers. Develop self-serve tools and content that reduce the need for hands-on support as we scale. Plan and facilitate QBRs with strategic accounts. Bring data. Bring insights. Bring the roadmap.\n\nExpansion & Retention Through Technical Depth Identify what makes Tread sticky and execute relentlessly to deliver that value. Expand revenue with existing customers by uncovering problems and solving them before they're asked. Help turn our data moat into self-reinforcing product loops that get smarter the longer a customer is on the platform. Own the technical health of your portfolio.\n\nWhat Success Looks Like\n\nFirst 90 Days\n\n - Visited at least 3 customer sites. You can describe their dispatch workflow, scale house operations, and back-office processes from memory.\n\n - Shipped at least 2 customer-facing improvements based on direct field observations.\n\n - Taken ownership of the technical implementation for at least 1 new customer.\n\n - Built relationships with key users at your assigned accounts. They know your name and they call you directly.\n\n - Established a baseline view of open technical debt and integration gaps across your portfolio.\n\nFirst 6 Months\n\n - Embedded with customers. Learning the codebase while in the field. Shipping fast alongside a team of under 20 people where your impact is immediate and visible.\n\n - Established a repeatable pattern: customer meeting to shipped outcome in under a week.\n\n - Contributed meaningfully to at least 1 product initiative that originated from your field work.\n\n - Technical training content and integration guides shipped and in use by customers.\n\n - At least 1 expansion opportunity identified and influenced by your work.\n\n - Time-to-first-value for new implementations trending down measurably.\n\nFirst Year\n\n - Customers in your portfolio have measurably higher adoption and satisfaction than baseline.\n\n - You've become the connective tissue between what customers need and what we build.\n\n - Multiple product features in production trace back to your field insights.\n\n - You've helped define the FDE playbook that the next hire will use.\n\n - You are the person customers call when something is broken, and the person Engineering trusts to represent the field in any roadmap conversation.\n\nWhat We’re Looking For\n\n - 2+ years of software engineering experience. You can write production code in at least one of: Ruby/Rails, JavaScript/React, Python, or equivalent.\n\n - Comfort with APIs, databases, and data pipelines. You can read a GraphQL schema, debug an integration, and write a migration.\n\n - Customer-facing instincts. You can sit in a room with a VP of Operations at a trucking company and earn their trust.\n\n - Bias toward action. You see a problem, you fix it. You don't wait for a ticket.\n\n - Strong written and verbal communication. You can translate a messy customer conversation into a clear problem statement and a proposed solution.\\\n\n - Willingness to travel. You'll be on-site with customers regularly, especially early on.\n\n - High ownership, low ego. You'll do support tickets, write docs, build features, and present at QBRs. Whatever the customer needs.\n\n - Analytical mindset. You instrument what you ship, track adoption, and use data to decide what to build next.\n\n - Builder mentality. You'll personally debug a scale house integration in the morning and prototype a new dispatcher workflow in the afternoon.\n\nBonus Points\n\n - Experience in construction technology, heavy civil, logistics, supply chain, or field services.\n\n - Familiarity with our stack: Rails, GraphQL, React, Intercom, Linear, PostHog, Omni.\n\n - Experience with AI/ML product development or leveraging LLMs in customer-facing workflows (AI-assisted integrations, automated onboarding, intelligent ticket deflection).\n\n - You've worked at a Series A–C company with under 50 people and thrived in the ambiguity.\n\n - Experience with e-ticketing, scale house systems, ERP integrations, or DOT compliance.\n\n - You've shipped a feature that originated from a single customer conversation and watched it scale across an entire book of business."},"descriptionClosing":null},"shortDescription":"Build AI-Native Product in the Field for Agentic Logistics Platform in Construction Materials","applicationFormDefinitionId":null,"surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"AI Native Forward Deployed Engineer","description":"<p style=\"min-height:1.5em\"><
